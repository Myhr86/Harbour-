<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1218">
  <title>Harbor Compact</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="anchor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-1 5.83V10H8v2h3v7.9A7 7 0 0 1 5.1 14H7l-3-4-3 4h2.08A9 9 0 0 0 12 22a9 9 0 0 0 8.92-8H23l-3-4-3 4h1.9A7 7 0 0 1 13 19.9V12h3v-2h-3V7.83A3 3 0 0 0 12 2Zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z" fill="currentColor"/></svg>
      <div>
        <h1>Harbor Compact</h1>
        <p class="tagline">One city. Three sides. One economy.</p>
      </div>
    </div>
    <div class="clock" id="clock"></div>
    <div class="who" id="who"></div>
  </header>
  <div class="stats" id="stats"></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="map"><svg viewBox="0 0 24 24"><path d="M3 21V9l5-4 5 4v12h-3v-5H6v5H3Zm11 0V7h7v14h-7Zm2-9h3v-2h-3v2Zm0 4h3v-2h-3v2Z" fill="currentColor"/></svg><span>Map</span></button>
    <button data-tab="ledger"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4V3Zm2 2v14h12V5H6Zm2 2h8v2H8V7Zm0 4h8v2H8v-2Zm0 4h5v2H8v-2Z" fill="currentColor"/></svg><span>Ledger</span></button>
    <button data-tab="events"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 1 5.83V9h5v2h-5v8.9c2.5-.4 4.5-2.2 5.3-4.6l-1.7-.3 3.4-3 1 4.4-1.3-.3A9 9 0 0 1 12 22a9 9 0 0 1-8.7-5.9L2 16.4l1-4.4 3.4 3-1.7.3c.8 2.4 2.8 4.2 5.3 4.6V11H5V9h5V7.83A3 3 0 0 1 12 2Z" fill="currentColor"/></svg><span>Events</span><i class="dot" id="evdot"></i></button>
    <button data-tab="chat"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.5 3.4 6L4 21l4.6-2.3c1.1.2 2.2.3 3.4.3 5.5 0 10-3.6 10-8s-4.5-8-10-8ZM8 12.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm4 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm4 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="currentColor"/></svg><span>Chat</span><i class="dot" id="chatdot"></i></button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6Z" fill="currentColor"/></svg><span>Profile</span></button>
  </nav>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
